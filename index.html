<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>オンライン人狼</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- 左上：メニューボタン -->
    <div class="mini mini-left" id="menu">
        <button id="menubtn" title="メニューを開く"><img src="img/menu.png" width="70px"></button>
    </div>

    <!-- 右上：チャットボタン -->
    <div class="mini mini-right" id="chat">
        <button id="messagebtn" title="チャットを開く"><img src="img/message.png" width="70px"></button>
    </div>

    <div class="mini mini-bottom">
        <button id="backbtn" title="ホームに戻る" onclick="showPage('title')"><img src="img/home.png" width="70px"></button>
    </div>

    <!-- 背景オーバーレイ -->
    <div id="overlay" class="overlay"></div>

    <!-- 左から出てくるサイドメニュー -->
    <nav id="side-menu" class="side-menu">
        <button id="close-menu-btn" class="close-btn">&times;</button>
        <ul>
            <li><a onclick="showPage('friend')">フレンド</a></li>
            <li><a onclick="showPage('settings')">設定</a></li>
        </ul>
    </nav>

    <!-- 右から出てくるチャット欄 -->
    <div id="side-chat" class="side-chat">
        <div class="chat-header">
            <h3>チャット</h3>
            <button id="close-chat-btn" class="close-btn">&times;</button>
        </div>
        <div class="chat-content" id="chat-content"></div>
        <div class="chat-input-area">
            <input id="message-input" type="text" placeholder="メッセージを入力..." />
            <button class="send-btn" id="send-btn">送信</button>
        </div>
    </div>

    <div class="page" id="settings">
        <div>
            <h1>設定</h1>
            <div class="setting">
                <div class="input-container">
                    <p>ユーザー名を変更する(※15字以内)</p>
                    <input id="name-input" type="text" class="textbox-1" placeholder="ユーザー名" maxlength="15"/>
                </div>
                <button id="set-name">設定</button>
            </div>
        </div>
    </div>


    <div class="page" id="title">
        <div style="display:block">
            <h1>オンライン人狼</h1>
            <button onclick="showPage('room')">部屋を作る</button>
            <button onclick="showPage('join')">部屋に入る</button>
            <button onclick="showPage('role')">役職一覧</button>
        </div>
    </div>
    
    <div class="page" id="room">
        <div class="lobby-panel">
            <h1>ロビー</h1>
            <div class="room-id-box">
                <span>RoomID</span>
                <div id="room-id-text" class="room-id-text">-</div>
            </div>
            <div class="participant-box">
                <h2>参加中の人</h2>
                <ul id="participant-list" class="participant-list"></ul>
            </div>
        </div>
    </div>

    <div class="page" id="join">

    </div>

    <div class="page" id="role">

    </div>

    <script src="data.js"></script>
    <script src="gui.js"></script>
    <script src="main.js" defer></script>
</body>

</html>
